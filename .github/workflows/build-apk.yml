          package com.mekeirish.remotecontrol;

          import android.annotation.SuppressLint;
          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.os.Build;
          import android.os.PowerManager;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @SuppressLint({"NewApi", "MissingPermission", "WakelockTimeout", "ApplySharedPref"})
          @SuppressWarnings("deprecation")
          public final class WakeNotifyCore {
              public static final String ACTION_FIRE = "com.mekeirish.remotecontrol.WAKE_NOTIFY_FIRE";
              public static final String CHANNEL_ID = "wake_alerts";
              private static final String PREFS = "wake_notify";
              private static final String KEY = "items";
              private static final Object LOCK = new Object();

              private WakeNotifyCore() {
              }

              private static JSONArray readAll(Context c) {
                  try {
                      return new JSONArray(c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY, "[]"));
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              private static void writeAll(Context c, JSONArray a) {
                  c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY, a.toString()).commit();
              }

              public static String listJson(Context c) {
                  synchronized (LOCK) {
                      return readAll(c).toString();
                  }
              }

              private static JSONObject find(Context c, int id) {
                  JSONArray a = readAll(c);
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o != null && o.optInt("id", -1) == id) return o;
                  }
                  return null;
              }

              private static void drop(Context c, int id) {
                  JSONArray a = readAll(c);
                  JSONArray out = new JSONArray();
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o != null && o.optInt("id", -1) != id) out.put(o);
                  }
                  writeAll(c, out);
              }

              private static void upsert(Context c, JSONObject n) {
                  drop(c, n.optInt("id", -1));
                  JSONArray a = readAll(c);
                  a.put(n);
                  writeAll(c, a);
              }

              private static int piFlags() {
                  int f = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) f |= PendingIntent.FLAG_IMMUTABLE;
                  return f;
              }

              private static PendingIntent firePi(Context c, int id) {
                  Intent i = new Intent(c, WakeNotifyReceiver.class);
                  i.setAction(ACTION_FIRE);
                  i.putExtra("id", id);
                  return PendingIntent.getBroadcast(c, id, i, piFlags());
              }

              private static PendingIntent launchPi(Context c, int id) {
                  Intent i = new Intent(c, MainActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  i.putExtra("wake_notify_id", id);
                  return PendingIntent.getActivity(c, id, i, piFlags());
              }

              public static boolean canExact(Context c) {
                  if (Build.VERSION.SDK_INT < 31) return true;
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  return am != null && am.canScheduleExactAlarms();
              }

              public static void ensureChannel(Context c) {
                  if (Build.VERSION.SDK_INT < 26) return;
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null || nm.getNotificationChannel(CHANNEL_ID) != null) return;
                  NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "Alertes", NotificationManager.IMPORTANCE_HIGH);
                  ch.setDescription("Notifications prioritaires qui reveillent l'appareil");
                  ch.enableVibration(true);
                  ch.setVibrationPattern(new long[]{0, 400, 200, 400});
                  ch.enableLights(true);
                  ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                  ch.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION),
                          new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build());
                  nm.createNotificationChannel(ch);
              }

              private static void wakeScreen(Context c) {
                  try {
                      PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                      if (pm == null) return;
                      PowerManager.WakeLock wl = pm.newWakeLock(
                              PowerManager.SCREEN_BRIGHT_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP | PowerManager.ON_AFTER_RELEASE,
                              c.getPackageName() + ":wake_notify");
                      wl.acquire(8000);
                  } catch (Exception e) {
                  }
              }

              public static void show(Context c, int id, String title, String body, boolean wake) {
                  ensureChannel(c);
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  String t = (title == null) ? "" : title;
                  String b = (body == null) ? "" : body;
                  Notification.Builder nb;
                  if (Build.VERSION.SDK_INT >= 26) {
                      nb = new Notification.Builder(c, CHANNEL_ID);
                  } else {
                      nb = new Notification.Builder(c);
                      nb.setPriority(Notification.PRIORITY_HIGH);
                      nb.setDefaults(Notification.DEFAULT_ALL);
                  }
                  nb.setSmallIcon(android.R.drawable.ic_popup_reminder)
                          .setContentTitle(t)
                          .setContentText(b)
                          .setStyle(new Notification.BigTextStyle().bigText(b))
                          .setAutoCancel(true)
                          .setCategory(Notification.CATEGORY_REMINDER)
                          .setVisibility(Notification.VISIBILITY_PUBLIC)
                          .setWhen(System.currentTimeMillis())
                          .setContentIntent(launchPi(c, id));
                  if (wake) nb.setFullScreenIntent(launchPi(c, id), true);
                  nm.notify(id, nb.build());
                  if (wake) wakeScreen(c);
              }

              public static boolean arm(Context c, JSONObject o) {
                  try {
                      int id = o.getInt("id");
                      long at = o.getLong("at");
                      boolean clock = o.optBoolean("clock", true);
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      if (am == null) return false;
                      PendingIntent pi = firePi(c, id);
                      if (canExact(c)) {
                          try {
                              if (clock) {
                                  am.setAlarmClock(new AlarmManager.AlarmClockInfo(at, launchPi(c, id)), pi);
                              } else if (Build.VERSION.SDK_INT >= 23) {
                                  am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                              } else {
                                  am.setExact(AlarmManager.RTC_WAKEUP, at, pi);
                              }
                              return true;
                          } catch (SecurityException se) {
                          }
                      }
                      if (Build.VERSION.SDK_INT >= 23) {
                          am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                      } else {
                          am.set(AlarmManager.RTC_WAKEUP, at, pi);
                      }
                      return false;
                  } catch (Exception e) {
                      return false;
                  }
              }

              public static boolean schedule(Context c, int id, String title, String body, long at, long repeatMs, boolean clock) throws Exception {
                  JSONObject n = new JSONObject();
                  n.put("id", id);
                  n.put("title", title);
                  n.put("body", body);
                  n.put("at", at);
                  n.put("repeat", repeatMs);
                  n.put("clock", clock);
                  synchronized (LOCK) {
                      upsert(c, n);
                  }
                  return arm(c, n);
              }

              public static void cancel(Context c, int id) {
                  synchronized (LOCK) {
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      if (am != null) am.cancel(firePi(c, id));
                      drop(c, id);
                  }
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.cancel(id);
              }

              public static void cancelAll(Context c) {
                  JSONArray a;
                  synchronized (LOCK) {
                      a = readAll(c);
                  }
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o != null) cancel(c, o.optInt("id", -1));
                  }
              }

              public static void fire(Context c, int id) {
                  JSONObject o;
                  synchronized (LOCK) {
                      o = find(c, id);
                  }
                  if (o == null) return;
                  show(c, id, o.optString("title", ""), o.optString("body", ""), true);
                  long rep = o.optLong("repeat", 0);
                  if (rep > 0) {
                      try {
                          long now = System.currentTimeMillis();
                          long next = o.optLong("at", now) + rep;
                          if (next <= now) next += ((now - next) / rep + 1) * rep;
                          o.put("at", next);
                          synchronized (LOCK) {
                              upsert(c, o);
                          }
                          arm(c, o);
                      } catch (Exception e) {
                      }
                  } else {
                      synchronized (LOCK) {
                          drop(c, id);
                      }
                  }
              }

              public static void rearmAll(Context c) {
                  JSONArray a;
                  synchronized (LOCK) {
                      a = readAll(c);
                  }
                  long now = System.currentTimeMillis();
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o == null) continue;
                      int id = o.optInt("id", -1);
                      long at = o.optLong("at", 0);
                      long rep = o.optLong("repeat", 0);
                      if (at <= now) {
                          if (rep > 0) {
                              try {
                                  o.put("at", at + ((now - at) / rep + 1) * rep);
                                  synchronized (LOCK) {
                                      upsert(c, o);
                                  }
                                  arm(c, o);
                              } catch (Exception e) {
                              }
                          } else {
                              show(c, id, o.optString("title", ""), o.optString("body", ""), true);
                              synchronized (LOCK) {
                                  drop(c, id);
                              }
                          }
                      } else {
                          arm(c, o);
                      }
                  }
              }
          }
          JAVAEOF

            cat > "$JAVA_DIR/WakeNotifyReceiver.java" << 'JAVAEOF'
          package com.mekeirish.remotecontrol;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class WakeNotifyReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null) return;
                  if (WakeNotifyCore.ACTION_FIRE.equals(intent.getAction())) {
                      WakeNotifyCore.fire(context, intent.getIntExtra("id", -1));
                  } else {
                      WakeNotifyCore.rearmAll(context);
                  }
              }
          }
          JAVAEOF

            cat > "$JAVA_DIR/WakeNotifyPlugin.java" << 'JAVAEOF'
          package com.mekeirish.remotecontrol;

          import android.annotation.SuppressLint;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationManagerCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @SuppressLint("NewApi")
          @CapacitorPlugin(name = "WakeNotify")
          public class WakeNotifyPlugin extends Plugin {
              private static volatile int launchId = -1;

              private static int grab(Intent i) {
                  if (i == null) return -1;
                  int id = i.getIntExtra("wake_notify_id", -1);
                  if (id != -1) {
                      launchId = id;
                      i.removeExtra("wake_notify_id");
                  }
                  return id;
              }

              @Override
              public void load() {
                  Context c = getContext();
                  WakeNotifyCore.ensureChannel(c);
                  WakeNotifyCore.rearmAll(c);
                  if (getActivity() != null) grab(getActivity().getIntent());
              }

              @Override
              protected void handleOnNewIntent(Intent intent) {
                  super.handleOnNewIntent(intent);
                  int id = grab(intent);
                  if (id != -1) {
                      JSObject o = new JSObject();
                      o.put("id", id);
                      notifyListeners("notificationTapped", o, true);
                  }
              }

              private JSObject buildStatus() {
                  Context c = getContext();
                  JSObject o = new JSObject();
                  o.put("sdk", Build.VERSION.SDK_INT);
                  o.put("notifications", NotificationManagerCompat.from(c).areNotificationsEnabled());
                  o.put("exactAlarms", WakeNotifyCore.canExact(c));
                  boolean fs = true;
                  if (Build.VERSION.SDK_INT >= 34) {
                      try {
                          NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                          fs = (Boolean) nm.getClass().getMethod("canUseFullScreenIntent").invoke(nm);
                      } catch (Exception e) {
                          fs = true;
                      }
                  }
                  o.put("fullScreen", fs);
                  boolean bat = false;
                  if (Build.VERSION.SDK_INT >= 23) {
                      PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                      bat = pm != null && pm.isIgnoringBatteryOptimizations(c.getPackageName());
                  }
                  o.put("batteryExempt", bat);
                  return o;
              }

              @PluginMethod
              public void schedule(PluginCall call) {
                  try {
                      Integer idObj = call.getInt("id");
                      int id = (idObj != null) ? idObj.intValue() : (int) (System.currentTimeMillis() % 2000000000L);
                      Double at = call.getDouble("at");
                      if (at == null) {
                          call.reject("Parametre at manquant");
                          return;
                      }
                      long when = at.longValue();
                      long min = System.currentTimeMillis() + 1000;
                      if (when < min) when = min;
                      long rep = call.getDouble("repeatMs", 0.0).longValue();
                      if (rep > 0 && rep < 60000) rep = 60000;
                      boolean clock = call.getBoolean("alarmClock", true);
                      boolean exact = WakeNotifyCore.schedule(getContext(), id, call.getString("title", ""), call.getString("body", ""), when, rep, clock);
                      JSObject r = new JSObject();
                      r.put("id", id);
                      r.put("at", when);
                      r.put("exact", exact);
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject("Echec : " + e.getMessage());
                  }
              }

              @PluginMethod
              public void show(PluginCall call) {
                  Integer idObj = call.getInt("id");
                  int id = (idObj != null) ? idObj.intValue() : (int) (System.currentTimeMillis() % 2000000000L);
                  WakeNotifyCore.show(getContext(), id, call.getString("title", ""), call.getString("body", ""), call.getBoolean("wake", false));
                  JSObject r = new JSObject();
                  r.put("id", id);
                  call.resolve(r);
              }

              @PluginMethod
              public void cancel(PluginCall call) {
                  Integer idObj = call.getInt("id");
                  if (idObj == null) {
                      call.reject("Parametre id manquant");
                      return;
                  }
                  WakeNotifyCore.cancel(getContext(), idObj.intValue());
                  call.resolve();
              }

              @PluginMethod
              public void cancelAll(PluginCall call) {
                  WakeNotifyCore.cancelAll(getContext());
                  call.resolve();
              }

              @PluginMethod
              public void list(PluginCall call) {
                  try {
                      JSObject r = new JSObject();
                      r.put("items", new JSArray(WakeNotifyCore.listJson(getContext())));
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject("Lecture impossible");
                  }
              }

              @PluginMethod
              public void status(PluginCall call) {
                  call.resolve(buildStatus());
              }

              @PluginMethod
              public void requestNotifPermission(PluginCall call) {
                  Context c = getContext();
                  if (Build.VERSION.SDK_INT >= 33 && !NotificationManagerCompat.from(c).areNotificationsEnabled() && getActivity() != null) {
                      ActivityCompat.requestPermissions(getActivity(), new String[]{"android.permission.POST_NOTIFICATIONS"}, 4242);
                  }
                  call.resolve(buildStatus());
              }

              @PluginMethod
              public void getLaunch(PluginCall call) {
                  JSObject o = new JSObject();
                  o.put("id", launchId);
                  launchId = -1;
                  call.resolve(o);
              }

              @PluginMethod
              public void openSettings(PluginCall call) {
                  String type = call.getString("type", "app");
                  Context c = getContext();
                  String pkg = c.getPackageName();
                  Intent i;
                  if ("exact".equals(type) && Build.VERSION.SDK_INT >= 31) {
                      i = new Intent("android.settings.REQUEST_SCHEDULE_EXACT_ALARM", Uri.parse("package:" + pkg));
                  } else if ("fullscreen".equals(type) && Build.VERSION.SDK_INT >= 34) {
                      i = new Intent("android.settings.MANAGE_APP_USE_FULL_SCREEN_INTENT", Uri.parse("package:" + pkg));
                  } else if ("battery".equals(type) && Build.VERSION.SDK_INT >= 23) {
                      i = new Intent("android.settings.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS", Uri.parse("package:" + pkg));
                  } else if ("notifications".equals(type) && Build.VERSION.SDK_INT >= 26) {
                      i = new Intent("android.settings.APP_NOTIFICATION_SETTINGS");
                      i.putExtra("android.provider.extra.APP_PACKAGE", pkg);
                  } else {
                      i = new Intent("android.settings.APPLICATION_DETAILS_SETTINGS", Uri.parse("package:" + pkg));
                  }
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      c.startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      try {
                          Intent d = new Intent("android.settings.APPLICATION_DETAILS_SETTINGS", Uri.parse("package:" + pkg));
                          d.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          c.startActivity(d);
                          call.resolve();
                      } catch (Exception e2) {
                          call.reject("Ouverture impossible");
                      }
                  }
              }
          }
          JAVAEOF

            if ! grep -q "WakeNotifyPlugin" "$JAVA_DIR/MainActivity.java"; then
              sed -i 's/super.onCreate(savedInstanceState);/registerPlugin(WakeNotifyPlugin.class);\n        super.onCreate(savedInstanceState);/' "$JAVA_DIR/MainActivity.java"
            fi

            cat > www/wakenotify.js << 'WAKEEOF'
          (function () {
            var C = window.Capacitor;
            var P = C && C.Plugins && C.Plugins.WakeNotify;
            if (!P) { console.log('WakeNotify : plugin indisponible'); return; }
            var perm = 'default';
            var asked = false;
            var live = {};

            function toId(tag) {
