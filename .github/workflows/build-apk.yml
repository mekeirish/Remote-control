          MAIN_HTML=$(cd www && find . -maxdepth 1 -name "*.html" | head -n 1)
          if [ -n "$MAIN_HTML" ]; then
            node nk-setup.js "com.mekeirish.remotecontrol" "www/$MAIN_HTML" "$MANIFEST"
          else
            node nk-setup.js "com.mekeirish.remotecontrol" "" "$MANIFEST"
          fi
          rm -f nk-setup.js

          if ! grep -q "registerPlugin(NativeKitPlugin.class)" "$JAVA_DIR/MainActivity.java"; then echo "ERREUR : NativeKit non enregistre"; exit 1; fi
          if [ ! -f "$JAVA_DIR/NativeKitPlugin.java" ] || [ ! -f www/nativekit.js ]; then echo "ERREUR : NativeKit non injecte"; exit 1; fi
          npx cap sync android

      - name: Génération icône
        run: |
          cd capacitor-app
          npm install -D @capacitor/assets
          mkdir -p assets
          if [ -f "../icon.png" ]; then
            cp ../icon.png assets/icon.png
            npx @capacitor/assets generate --android
          fi

      - name: Versioning et Signature
        run: |
          cd capacitor-app/android/app
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" build.gradle
          
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            cat >> build.gradle << EOF
          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias "${{ secrets.KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEY_PASSWORD }}"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          fi

      - name: Résolution conflits Kotlin
        run: |
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> capacitor-app/android/app/build.gradle

      - name: Compilation APK
        run: |
          cd capacitor-app/android
          chmod +x gradlew
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Renommer APK
        run: |
          cd capacitor-app/android/app/build/outputs/apk/
          if [ -d "release" ]; then
            mv release/app-release.apk ../../../../../Remote-control.apk
          else
            mv debug/app-debug.apk ../../../../../Remote-control.apk
          fi

      - name: Publication en Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "capacitor-app/Remote-control.apk"
          tag: "v${{ github.run_number }}"
          name: "Remote-control v${{ github.run_number }}"
          allowUpdates: false
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}