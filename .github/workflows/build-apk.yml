          cat > nk-setup.js << 'NODEEOF'
          var fs = require('fs');
          var appId = process.argv[2];
          var html = process.argv[3] || '';
          var manifest = process.argv[4];
          var t = (html && fs.existsSync(html)) ? fs.readFileSync(html, 'utf8') : '';

          var color = '';
          var m1 = /name=["']theme-color["'][^>]*content=["'](#[0-9a-fA-F]{3,6})["']/i.exec(t);
          var m2 = /content=["'](#[0-9a-fA-F]{3,6})["'][^>]*name=["']theme-color["']/i.exec(t);
          color = m1 ? m1[1] : (m2 ? m2[1] : '');
          if (color.length === 4) {
            color = '#' + color[1] + color[1] + color[2] + color[2] + color[3] + color[3];
          }
          if (color.length !== 7) color = '';

          var cp = 'capacitor.config.json';
          if (color && fs.existsSync(cp)) {
            var cfg = JSON.parse(fs.readFileSync(cp, 'utf8'));
            cfg.backgroundColor = color;
            cfg.android = cfg.android || {};
            cfg.android.backgroundColor = color;
            fs.writeFileSync(cp, JSON.stringify(cfg, null, 2), 'utf8');
          }

          var m = fs.readFileSync(manifest, 'utf8');
          if (m.indexOf('windowSoftInputMode') === -1) {
