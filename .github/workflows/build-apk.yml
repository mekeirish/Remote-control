          cat > "$JAVA_DIR/NativeKitPlugin.java" << 'JAVAEOF'
          package com.mekeirish.remotecontrol;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageInfo;
          import android.content.pm.ShortcutInfo;
          import android.content.pm.ShortcutManager;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.Icon;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;
          import org.json.JSONObject;

          @SuppressLint({"NewApi", "SourceLockedOrientationActivity"})
          @SuppressWarnings("deprecation")
          @CapacitorPlugin(name = "NativeKit")
          public class NativeKitPlugin extends Plugin {
              private static volatile String launchUrl = null;
              private static volatile String launchText = null;
              private static volatile String launchShortcut = null;

              private static boolean grab(Intent i) {
                  if (i == null) return false;
                  boolean found = false;
                  String sc = i.getStringExtra("nk_url");
                  if (sc != null) {
                      launchShortcut = sc;
                      i.removeExtra("nk_url");
                      i.setAction(Intent.ACTION_MAIN);
                      return true;
                  }
                  String action = i.getAction();
                  if (Intent.ACTION_SEND.equals(action)) {
                      CharSequence t = i.getCharSequenceExtra(Intent.EXTRA_TEXT);
                      if (t == null) t = i.getCharSequenceExtra(Intent.EXTRA_SUBJECT);
                      if (t != null) {
                          launchText = t.toString();
                          found = true;
                      }
                      i.removeExtra(Intent.EXTRA_TEXT);
                      i.setAction(Intent.ACTION_MAIN);
                  } else if (Intent.ACTION_VIEW.equals(action) && i.getData() != null) {
                      launchUrl = i.getData().toString();
                      i.setData(null);
                      i.setAction(Intent.ACTION_MAIN);
                      found = true;
                  }
                  return found;
              }

              private static JSObject takeLaunch() {
                  JSObject o = new JSObject();
                  if (launchUrl != null) o.put("url", launchUrl);
                  if (launchText != null) o.put("text", launchText);
                  if (launchShortcut != null) o.put("shortcut", launchShortcut);
                  launchUrl = null;
                  launchText = null;
                  launchShortcut = null;
                  return o;
              }

              private static Integer parseColor(String s) {
                  if (s == null) return null;
                  String t = s.trim();
                  if (t.length() == 4 && t.charAt(0) == '#') {
                      t = "#" + t.charAt(1) + t.charAt(1) + t.charAt(2) + t.charAt(2) + t.charAt(3) + t.charAt(3);
                  }
                  try {
                      return Integer.valueOf(Color.parseColor(t));
                  } catch (Exception e) {
                      return null;
                  }
              }

              private void ui(Runnable r) {
                  Activity a = getActivity();
                  if (a != null) a.runOnUiThread(r);
              }

              private String folder() {
                  try {
                      String l = getContext().getApplicationInfo().loadLabel(getContext().getPackageManager()).toString().replaceAll("[^A-Za-z0-9._ -]", "_").trim();
                      if (l.length() > 0) return l;
                  } catch (Exception e) {
                  }
                  return "App";
              }

              private void toastNow(final String text, final boolean longDuration) {
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          Toast.makeText(getContext(), text, longDuration ? Toast.LENGTH_LONG : Toast.LENGTH_SHORT).show();
                      }
                  });
              }

              @Override
              public void load() {
                  Activity a = getActivity();
                  if (a == null) return;
                  grab(a.getIntent());
                  a.runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              WebView wv = getBridge().getWebView();
                              WebSettings s = wv.getSettings();
                              s.setSupportZoom(false);
                              s.setBuiltInZoomControls(false);
                              s.setDisplayZoomControls(false);
                              s.setTextZoom(100);
                              wv.setOverScrollMode(View.OVER_SCROLL_NEVER);
                          } catch (Exception e) {
                          }
                      }
                  });
              }

              @Override
              protected void handleOnNewIntent(Intent intent) {
                  super.handleOnNewIntent(intent);
                  if (grab(intent)) notifyListeners("appIntent", takeLaunch(), true);
              }

              @PluginMethod
              public void getLaunch(PluginCall call) {
                  call.resolve(takeLaunch());
              }

              @PluginMethod
              public void setBars(final PluginCall call) {
                  Integer parsed = parseColor(call.getString("color"));
                  if (parsed == null) {
                      call.reject("Couleur invalide");
                      return;
                  }
                  final int col = parsed.intValue();
                  double lum = (0.299 * Color.red(col) + 0.587 * Color.green(col) + 0.114 * Color.blue(col)) / 255.0;
                  boolean lightTmp = lum > 0.6;
                  Boolean dk = call.getBoolean("dark");
                  if (dk != null) lightTmp = !dk.booleanValue();
                  final boolean light = lightTmp;
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Window w = getActivity().getWindow();
                              w.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                              w.setStatusBarColor(col);
                              w.setNavigationBarColor(col);
                              w.setBackgroundDrawable(new ColorDrawable(col));
                              if (Build.VERSION.SDK_INT >= 30) {
                                  WindowInsetsController ic = w.getInsetsController();
                                  if (ic != null) {
                                      int m = WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS | WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS;
                                      ic.setSystemBarsAppearance(light ? m : 0, m);
                                  }
                              } else if (Build.VERSION.SDK_INT >= 23) {
                                  View d = w.getDecorView();
                                  int f = d.getSystemUiVisibility();
                                  if (light) f |= View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR; else f &= ~View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                                  if (Build.VERSION.SDK_INT >= 26) {
                                      if (light) f |= View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR; else f &= ~View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                                  }
                                  d.setSystemUiVisibility(f);
                              }
                          } catch (Exception e) {
                          }
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void setImmersive(final PluginCall call) {
                  final boolean on = call.getBoolean("enabled", true);
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Window w = getActivity().getWindow();
                              if (Build.VERSION.SDK_INT >= 30) {
                                  WindowInsetsController ic = w.getInsetsController();
                                  if (ic != null) {
                                      if (on) {
                                          ic.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                                          ic.hide(WindowInsets.Type.systemBars());
                                      } else {
                                          ic.show(WindowInsets.Type.systemBars());
                                      }
                                  }
                              } else {
                                  View d = w.getDecorView();
                                  int f = d.getSystemUiVisibility();
                                  int m = View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_FULLSCREEN;
                                  if (on) f |= m; else f &= ~m;
                                  d.setSystemUiVisibility(f);
                              }
                          } catch (Exception e) {
                          }
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void keepAwake(final PluginCall call) {
                  final boolean on = call.getBoolean("enabled", true);
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Window w = getActivity().getWindow();
                              if (on) w.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); else w.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          } catch (Exception e) {
                          }
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void secure(final PluginCall call) {
                  final boolean on = call.getBoolean("enabled", true);
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Window w = getActivity().getWindow();
                              if (on) w.addFlags(WindowManager.LayoutParams.FLAG_SECURE); else w.clearFlags(WindowManager.LayoutParams.FLAG_SECURE);
                          } catch (Exception e) {
                          }
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void setBrightness(final PluginCall call) {
                  Double d = call.getDouble("value");
                  final float v = (d == null || d.doubleValue() < 0) ? WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE : (float) Math.min(1.0, d.doubleValue());
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Window w = getActivity().getWindow();
                              WindowManager.LayoutParams lp = w.getAttributes();
                              lp.screenBrightness = v;
                              w.setAttributes(lp);
                          } catch (Exception e) {
                          }
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void setOrientation(final PluginCall call) {
                  String o = call.getString("orientation", "any");
                  int v;
                  if ("portrait-primary".equals(o)) v = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT;
                  else if ("portrait-secondary".equals(o)) v = ActivityInfo.SCREEN_ORIENTATION_REVERSE_PORTRAIT;
                  else if ("portrait".equals(o)) v = ActivityInfo.SCREEN_ORIENTATION_SENSOR_PORTRAIT;
                  else if ("landscape-primary".equals(o)) v = ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE;
                  else if ("landscape-secondary".equals(o)) v = ActivityInfo.SCREEN_ORIENTATION_REVERSE_LANDSCAPE;
                  else if ("landscape".equals(o)) v = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE;
                  else v = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED;
                  final int mode = v;
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              getActivity().setRequestedOrientation(mode);
                          } catch (Exception e) {
                          }
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void toast(PluginCall call) {
                  toastNow(call.getString("text", ""), call.getBoolean("longDuration", false));
                  call.resolve();
              }

              @PluginMethod
              public void share(PluginCall call) {
                  try {
                      String title = call.getString("title", "");
                      String text = call.getString("text", "");
                      String url = call.getString("url", "");
                      String nl = String.valueOf((char) 10);
                      String body = text;
                      if (url.length() > 0) body = (body.length() > 0) ? (body + nl + url) : url;
                      if (body.length() == 0 && title.length() == 0) {
                          call.reject("Rien a partager");
                          return;
                      }
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType("text/plain");
                      if (title.length() > 0) i.putExtra(Intent.EXTRA_SUBJECT, title);
                      i.putExtra(Intent.EXTRA_TEXT, body.length() > 0 ? body : title);
                      Intent ch = Intent.createChooser(i, title.length() > 0 ? title : null);
                      Activity a = getActivity();
                      if (a != null) {
                          a.startActivity(ch);
                      } else {
                          ch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(ch);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Partage impossible");
                  }
              }

              @PluginMethod
              public void openUrl(PluginCall call) {
                  try {
                      String url = call.getString("url");
                      if (url == null) {
                          call.reject("URL manquante");
                          return;
                      }
                      Uri u = Uri.parse(url.trim());
                      String sc = u.getScheme();
                      if (sc == null) {
                          call.reject("URL invalide");
                          return;
                      }
                      sc = sc.toLowerCase();
                      if (!(sc.equals("http") || sc.equals("https") || sc.equals("mailto") || sc.equals("tel") || sc.equals("sms") || sc.equals("smsto") || sc.equals("geo"))) {
                          call.reject("Protocole refuse");
                          return;
                      }
                      Intent i = new Intent(Intent.ACTION_VIEW, u);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Ouverture impossible");
                  }
              }

              @PluginMethod
              public void saveFile(final PluginCall call) {
                  if (Build.VERSION.SDK_INT < 29) {
                      call.reject("Android 10 minimum requis");
                      return;
                  }
                  final String name = call.getString("name", "download").replaceAll("[^A-Za-z0-9._-]", "_");
                  final String data = call.getString("data");
                  final String mime = call.getString("mime", "application/octet-stream");
                  if (data == null) {
                      call.reject("Aucune donnee");
                      return;
                  }
                  final String dir = folder();
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                              ContentResolver cr = getContext().getContentResolver();
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                              v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                              v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/" + dir);
                              v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                              Uri uri = cr.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                              if (uri == null) throw new Exception("Insertion impossible");
                              OutputStream out = cr.openOutputStream(uri);
                              if (out == null) throw new Exception("Ecriture impossible");
                              out.write(bytes);
                              out.close();
                              ContentValues done = new ContentValues();
                              done.put(MediaStore.MediaColumns.IS_PENDING, 0);
                              cr.update(uri, done, null, null);
                              toastNow("Enregistre dans Telechargements/" + dir, true);
                              JSObject r = new JSObject();
                              r.put("uri", uri.toString());
                              call.resolve(r);
                          } catch (Exception e) {
                              call.reject("Echec : " + e.getMessage());
                          }
                      }
                  }).start();
              }

              @PluginMethod
              public void setShortcuts(PluginCall call) {
                  if (Build.VERSION.SDK_INT < 25) {
                      call.resolve();
                      return;
                  }
                  try {
                      JSArray items = call.getArray("items");
                      Context c = getContext();
                      ShortcutManager sm = (ShortcutManager) c.getSystemService(Context.SHORTCUT_SERVICE);
                      if (items == null || sm == null) {
                          call.resolve();
                          return;
                      }
                      List<ShortcutInfo> list = new ArrayList<>();
                      int max = Math.min(4, sm.getMaxShortcutCountPerActivity());
                      int icon = c.getApplicationInfo().icon;
                      for (int k = 0; k < items.length() && list.size() < max; k++) {
                          JSONObject o = items.getJSONObject(k);
                          String label = o.optString("label", "").trim();
                          if (label.length() == 0) continue;
                          Intent in = new Intent(c, MainActivity.class);
                          in.setAction(Intent.ACTION_VIEW);
                          in.putExtra("nk_url", o.optString("url", "/"));
                          in.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                          ShortcutInfo.Builder b = new ShortcutInfo.Builder(c, o.optString("id", "sc" + k))
                                  .setShortLabel(label)
                                  .setLongLabel(label)
                                  .setIntent(in);
                          if (icon != 0) b.setIcon(Icon.createWithResource(c, icon));
                          list.add(b.build());
                      }
                      sm.setDynamicShortcuts(list);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Raccourcis impossibles");
                  }
              }

              @PluginMethod
              public void info(PluginCall call) {
                  JSObject o = new JSObject();
                  Context c = getContext();
                  o.put("sdk", Build.VERSION.SDK_INT);
                  o.put("manufacturer", Build.MANUFACTURER);
                  o.put("model", Build.MODEL);
                  o.put("brand", Build.BRAND);
                  o.put("package", c.getPackageName());
                  try {
                      PackageInfo pi = c.getPackageManager().getPackageInfo(c.getPackageName(), 0);
                      o.put("versionName", pi.versionName);
                      long vc = (Build.VERSION.SDK_INT >= 28) ? pi.getLongVersionCode() : pi.versionCode;
                      o.put("versionCode", vc);
                  } catch (Exception e) {
                  }
                  call.resolve(o);
              }

              @PluginMethod
              public void minimize(PluginCall call) {
                  Activity a = getActivity();
                  if (a != null) a.moveTaskToBack(true);
                  call.resolve();
              }

              @PluginMethod
              public void exit(PluginCall call) {
                  Activity a = getActivity();
                  call.resolve();
                  if (a != null) a.finishAffinity();
              }
          }
