          (function () {
            if (window.NativeKit) return;
            var noop = function () {};
            var lastColor = '';

            function plugin() {
              var C = window.Capacitor;
              return C && C.Plugins && C.Plugins.NativeKit ? C.Plugins.NativeKit : null;
            }
            function call(name, arg) {
              var p = plugin();
              if (!p || typeof p[name] !== 'function') return Promise.reject(new Error('NativeKit indisponible'));
              return p[name](arg || {});
            }
            function emit(name, detail) {
              try { window.dispatchEvent(new CustomEvent(name, { detail: detail })); } catch (e) {}
            }

            try {
              var st = document.createElement('style');
              st.setAttribute('data-nativekit', '1');
              st.textContent = ':where(html,body){overscroll-behavior:none}'
                + ':where(*){-webkit-tap-highlight-color:transparent}'
                + ':where(img){-webkit-user-drag:none}'
