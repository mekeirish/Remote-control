              }
              var s = String(tag);
              var h = 0;
              for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
              return (Math.abs(h) % 2000000000) + 1;
            }
            function toTime(v) {
              if (v instanceof Date) return v.getTime();
              var n = Number(v);
              return isNaN(n) ? 0 : n;
            }
            function refresh() {
              return P.status().then(function (s) {
                if (s.notifications) perm = 'granted';
